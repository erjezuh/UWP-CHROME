<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico de compatibilidad</title><style>body{background:#10151e;color:#f4f6f8;font:18px Segoe UI,Arial;margin:3vw}h1{color:#8eea6a}button{padding:14px 22px;font-size:20px;background:#29415a;color:white;border:0;border-radius:8px}button:focus{outline:4px solid #8eea6a}li{padding:8px}.compatible{color:#8eea6a}.no-compatible{color:#ff8686}.compatibilidad-parcial{color:#ffd166}.no-se-puede-verificar{color:#ccc}pre{white-space:pre-wrap;background:#202938;padding:14px}</style><h1>Diagnóstico web</h1><p>Comprueba las capacidades expuestas por el motor integrado. Los resultados no sustituyen una prueba del juego real ni garantizan aceleración física.</p><button id="run">Ejecutar pruebas</button> <button id="export">Exportar informe JSON</button><ol id="results"></ol><pre id="extra"></pre><script>
const data={timestamp:new Date().toISOString(),userAgent:navigator.userAgent,results:[]};
function add(name,status,detail){data.results.push({name,status,detail});const li=document.createElement('li');li.className=status.toLowerCase().replaceAll(' ','-');const title=document.createElement('b');title.textContent=name+': '+status;const body=document.createTextNode(' — '+detail);li.append(title,body);document.querySelector('#results').append(li)}
async function run(){document.querySelector('#results').innerHTML='';data.results=[];
try{await WebAssembly.instantiate(new Uint8Array([0,97,115,109,1,0,0,0]));add('WebAssembly','COMPATIBLE','Se instanció un módulo mínimo')}catch(e){add('WebAssembly','NO COMPATIBLE',e.message)}
const canvas2=document.createElement('canvas');const gl2=canvas2.getContext('webgl2');
const canvas1=document.createElement('canvas');const gl1=canvas1.getContext('webgl')||canvas1.getContext('experimental-webgl');
add('WebGL 2',gl2?'COMPATIBLE':'NO COMPATIBLE',gl2?'Contexto WebGL 2 creado':'El runtime no pudo crear contexto WebGL 2. Fingir el User-Agent no lo habilita.');
add('WebGL 1',gl1?'COMPATIBLE':'NO COMPATIBLE',gl1?'Contexto WebGL 1 creado':'El runtime no pudo crear contexto WebGL 1');
const gl=gl2||gl1;
if(gl){const dbg=gl.getExtension('WEBGL_debug_renderer_info');let detail='Contexto creado; la API web no confirma aceleración física';if(dbg){data.renderer={vendor:gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL),renderer:gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)};detail+='; renderer informado: '+data.renderer.renderer} else data.renderer='No expuesto por política del navegador';add('GPU y aceleración','COMPATIBILIDAD PARCIAL',detail)}else{data.renderer='No disponible';add('GPU y aceleración','NO SE PUEDE VERIFICAR','No hay contexto WebGL para consultar el renderer')}
add('SharedArrayBuffer',typeof SharedArrayBuffer==='function'&&crossOriginIsolated?'COMPATIBLE':typeof SharedArrayBuffer==='function'?'COMPATIBILIDAD PARCIAL':'NO COMPATIBLE',`constructor=${typeof SharedArrayBuffer}; crossOriginIsolated=${!!window.crossOriginIsolated}; el sitio necesita aislamiento COOP/COEP`);
add('Atomics',typeof Atomics==='object'?'COMPATIBLE':'NO COMPATIBLE','La API existe; esto por sí solo no confirma threading WASM');
try{const url=URL.createObjectURL(new Blob(['postMessage("ok")'],{type:'text/javascript'}));const w=new Worker(url);await new Promise((resolve,reject)=>{w.onmessage=()=>{w.terminate();URL.revokeObjectURL(url);resolve()};w.onerror=e=>{w.terminate();URL.revokeObjectURL(url);reject(e)}});add('Web Workers','COMPATIBLE','Worker dedicado creado y respondió')}catch(e){add('Web Workers','NO COMPATIBLE',e.message)}
try{const gps=navigator.getGamepads?.().filter(Boolean)||[];add('Gamepad API',navigator.getGamepads?(gps.length?'COMPATIBLE':'COMPATIBILIDAD PARCIAL'):'NO COMPATIBLE',gps.length?`${gps.length} mando(s): ${gps.map(x=>x.id).join(', ')}`:'API disponible, pero no hay mando visible; conecta y pulsa un botón para comprobar')}catch(e){add('Gamepad API','NO COMPATIBLE',e.message)}
const pointer=typeof PointerEvent==='function';const fine=matchMedia('(pointer:fine)').matches;data.pointer={pointerEvents:pointer,finePointer:fine,pointerLock:!!(document.body.requestPointerLock||document.body.webkitRequestPointerLock)};
add('Ratón y puntero',pointer?'COMPATIBILIDAD PARCIAL':'NO COMPATIBLE',`Pointer Events=${pointer}; puntero fino=${fine}; Pointer Lock=${data.pointer.pointerLock}. Mueve y pulsa el ratón dentro de la página para comprobar entrada real. La presencia física del ratón solo se confirma al recibir eventos.`);
try{const C=window.AudioContext||window.webkitAudioContext;if(C){const c=new C();await c.close();add('Audio Web','COMPATIBLE','AudioContext creado; salida audible no medida')}else add('Audio Web','NO COMPATIBLE','AudioContext ausente')}catch(e){add('Audio Web','COMPATIBILIDAD PARCIAL',e.message)}
add('Memoria web','NO SE PUEDE VERIFICAR',performance.memory?'El heap JS no equivale a RAM total del proceso':'El navegador no expone métrica de heap JS');if(performance.memory)data.jsMemory={used:performance.memory.usedJSHeapSize,total:performance.memory.totalJSHeapSize,limit:performance.memory.jsHeapSizeLimit};
add('Demo 3D','COMPATIBILIDAD PARCIAL',gl2?'WebGL 2 está disponible; sin benchmark sostenido':gl1?'Solo WebGL 1 está disponible; sitios que exigen WebGL 2 no podrán ejecutarse':'WebGL no está disponible');add('Aislamiento/recursos externos','NO SE PUEDE VERIFICAR','COOP/COEP/CORS dependen de cada sitio y sus recursos');
document.querySelector('#extra').textContent=JSON.stringify(data,null,2)}
document.querySelector('#run').onclick=run;document.querySelector('#export').onclick=()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='xbox-gaming-browser-diagnostico.json';a.click();URL.revokeObjectURL(a.href)};run();</script></html>
