<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico de compatibilidad</title><style>body{background:#10151e;color:#f4f6f8;font:18px Segoe UI,Arial;margin:3vw}h1{color:#8eea6a}button{padding:14px 22px;font-size:20px;background:#29415a;color:white;border:0;border-radius:8px}li{padding:8px}.ok{color:#8eea6a}.no{color:#ff8686}.partial{color:#ffd166}.unknown{color:#ccc}pre{white-space:pre-wrap;background:#202938;padding:14px}</style><h1>Diagnóstico web</h1><p>Pruebas de capacidad del motor web. La detección no certifica rendimiento ni compatibilidad de un juego.</p><button id="run">Ejecutar pruebas</button> <button id="export">Exportar informe JSON</button><ol id="results"></ol><pre id="extra"></pre><canvas id="gl" width="320" height="180" hidden></canvas><script>
const data={timestamp:new Date().toISOString(),userAgent:navigator.userAgent,results:[]};
function add(name,status,detail){data.results.push({name,status,detail});const li=document.createElement('li');li.className=status.toLowerCase().replaceAll(' ','-');li.innerHTML='<b>'+name+': '+status+'</b> — '+detail;document.querySelector('#results').append(li)}
async function run(){document.querySelector('#results').innerHTML='';data.results=[];
try{const m=await WebAssembly.instantiate(new Uint8Array([0,97,115,109,1,0,0,0]));add('WebAssembly','COMPATIBLE','Módulo mínimo instanciado')}catch(e){add('WebAssembly','NO COMPATIBLE',e.message)}
const gl=document.querySelector('#gl').getContext('webgl2'); add('WebGL 2',gl?'COMPATIBLE':'NO COMPATIBLE',gl?'Contexto WebGL2 creado':'No se pudo crear contexto');
if(gl){const dbg=gl.getExtension('WEBGL_debug_renderer_info');add('Información gráfica','COMPATIBILIDAD PARCIAL',dbg?'Vendor/renderer disponible (no es prueba de aceleración real)':'Detalles del renderer ocultos; aceleración no verificable'); data.renderer=dbg?{vendor:gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL),renderer:gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)}:'no expuesto';}
add('SharedArrayBuffer',typeof SharedArrayBuffer==='function'&&crossOriginIsolated?'COMPATIBLE':typeof SharedArrayBuffer==='function'?'COMPATIBILIDAD PARCIAL':'NO COMPATIBLE',`constructor=${typeof SharedArrayBuffer}; crossOriginIsolated=${!!window.crossOriginIsolated}; requiere aislamiento COOP/COEP del sitio`);
add('Atomics',typeof Atomics==='object'?'COMPATIBLE':'NO COMPATIBLE','Disponibilidad de API; no prueba soporte de memoria compartida efectiva');
try{const w=new Worker(URL.createObjectURL(new Blob(['postMessage("ok")'],{type:'text/javascript'})));await new Promise((resolve,reject)=>{w.onmessage=()=>{w.terminate();resolve()};w.onerror=e=>reject(e)});add('Web Workers','COMPATIBLE','Worker dedicado respondió')}catch(e){add('Web Workers','NO COMPATIBLE',e.message)}
let gamepads='NO SE PUEDE VERIFICAR';try{gamepads=navigator.getGamepads?'COMPATIBILIDAD PARCIAL':'NO COMPATIBLE';const gp=navigator.getGamepads?.().filter(Boolean)||[];add('Gamepad API',gp.length?'COMPATIBLE':gamepads,gp.length?`${gp.length} mando(s): ${gp.map(x=>x.id).join(', ')}`:'API disponible, conecta y pulsa un botón para detectar el mando')}catch(e){add('Gamepad API','NO COMPATIBLE',e.message)}
try{const C=window.AudioContext||window.webkitAudioContext;if(C){const c=new C();await c.close();add('Audio Web','COMPATIBLE','AudioContext creado; salida audible no medida')}else add('Audio Web','NO COMPATIBLE','AudioContext ausente')}catch(e){add('Audio Web','COMPATIBILIDAD PARCIAL',e.message)}
add('Memoria web','NO SE PUEDE VERIFICAR',performance.memory?'Chromium expone memoria JS no equivalente a RAM del proceso':'El navegador no expone métrica de heap JS');if(performance.memory)data.jsMemory={used:performance.memory.usedJSHeapSize,total:performance.memory.totalJSHeapSize,limit:performance.memory.jsHeapSizeLimit};
add('Demo 3D','COMPATIBILIDAD PARCIAL',gl?'WebGL2 disponible; no se ejecuta benchmark sostenido':'No hay contexto WebGL2');add('Aislamiento/recursos externos','NO SE PUEDE VERIFICAR','Las políticas COOP/COEP/CORS deben inspeccionarse por sitio; no se prueban todos los recursos');
document.querySelector('#extra').textContent=JSON.stringify(data,null,2)}
document.querySelector('#run').onclick=run;document.querySelector('#export').onclick=()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='xbox-gaming-browser-diagnostico.json';a.click();URL.revokeObjectURL(a.href)};run();</script></html>
