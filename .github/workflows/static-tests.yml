name: Static project checks
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s tests -v
      - run: python -c "import xml.etree.ElementTree as E; E.parse('src/XboxGamingBrowser/Package.appxmanifest')"
