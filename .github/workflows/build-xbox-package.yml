name: Build Xbox UWP package
on:
  push:
    branches: ['arena/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Pruebas estáticas
        run: python -m unittest discover -s tests -v
      - name: Detectar MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restaurar, compilar x64 y firmar paquete de desarrollo
        shell: pwsh
        run: ./package.ps1 -Configuration Release
      - name: Adjuntar logs de compilación si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: XboxGamingBrowser-build-logs
          path: logs/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Publicar paquete como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: XboxGamingBrowser-x64-dev-signed
          path: |
            artifacts/XboxGamingBrowser-x64.appx
            artifacts/XboxGamingBrowser-signing.cer
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Adjuntar paquete a Release cuando se publica un tag v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/XboxGamingBrowser-x64.appx
            artifacts/XboxGamingBrowser-signing.cer
            artifacts/SHA256SUMS.txt
